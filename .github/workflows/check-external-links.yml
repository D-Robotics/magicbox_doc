name: Check external links

# 站外链接巡检：每天定时跑一次，发现 404 时自动开/更新一个固定 issue。
# 不挂 PR 触发，因此不阻塞任何人提交或合并。
# 目标：文档中心所有文档里的「文字外链」，不管指向哪个域名，只要线上 404 就报出来（宁误勿漏）。
# 扫描范围：docs/（中文）+ i18n/en/docusaurus-plugin-content-docs/current/（英文）。
# 过滤只排除「非真实链接」，不按域名排除（首跑后按实测校准）：
#   - --scheme http --scheme https：只查 http/https，file://、mailto 等跳过；
#   - --root-dir ${{ github.workspace }}：站内 /xxx 根相对路径先解析成 file://，再被 scheme 跳过；
#   - --exclude-all-private：内网/私有 IP、localhost 等占位符；
#   - --exclude 占位符：http://ip/、proxy_server_address、device-ip、development-board-ip、xn--ip-*；
#   - --exclude 图片：.png/.jpg/.gif/.svg/.webp/.ico（图片先不查，只查文字外链）；
#   - --exclude '.hobot.cc'：境外 runner 连不上（Connection failed、非 404），GitHub 上无信号可采，
#     本机实测 200 正常；China 侧可达性校验另议。
# --accept 里的 412/429/530：反爬/限流/异常状态码（服务器有响应、资源存在），非 404，视为可达。
# --max-concurrency 8：限制单仓并发（lychee 默认 128）。实测 16 并发会把 archive.d-robotics.cc
#   打成 504（同一文件本机/全球探针均 200），降到 8 后仍偶发，所以后面还加了串行复检。
# 注意不能用 --include '^https?://' 做白名单：lychee 里 include 一旦匹配会覆盖 exclude。

on:
  schedule:
    # 每天 UTC 04:12（北京时间 12:12），与本批其他仓错开 7 分钟，避免同时扫描同一批域名
    - cron: "12 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check-external-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # 发现失效链接时不要让 job 失败，交给下面的通知步骤处理
          fail: false
          args: >-
            --no-progress
            --max-concurrency 8
            --scheme http
            --scheme https
            --root-dir ${{ github.workspace }}
            --accept 200,204,301,302,307,308,401,403,412,429,530
            --timeout 15
            --retry-wait-time 2
            --max-retries 3
            --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
            --exclude-all-private
            --exclude '\.hobot\.cc'
            --exclude '(?i)^https?://(ip|device-ip|development-board-ip|proxy_server_address|xn--ip-[a-z0-9-]+)([^a-z0-9-]|$)'
            --exclude '\.(png|jpe?g|gif|svg|webp|ico)(\?.*)?$'
            'docs/**/*.md'
            'docs/**/*.mdx'
            'i18n/en/docusaurus-plugin-content-docs/current/**/*.md'
            'i18n/en/docusaurus-plugin-content-docs/current/**/*.mdx'

      # 串行复检：lychee 首轮报的 Errors 里混着境外 runner 到国内站点的链路抖动（典型是
      # archive.d-robotics.cc 的 504，或同一 URL 第二次出现时的 "Error (cached)"）。
      # 这里把 Errors 段里的每条 URL 逐条重查（一次一条、间隔 1 秒），复检通过就移出 Errors，
      # 单列到「复检通过（环境噪声）」。真 404、证书过期、对方站点真挂了复检仍失败，不会被放过。
      - name: Recheck failed links serially
        env:
          UA: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
        run: |
          python3 - <<'PY'
          import os, re, subprocess, time

          REPORT = "./lychee/out.md"
          UA = os.environ["UA"]
          ACCEPT = {200, 204, 206, 301, 302, 307, 308, 401, 403, 412, 429, 530}

          if not os.path.exists(REPORT):
              raise SystemExit(0)

          lines = open(REPORT, encoding="utf-8").read().split("\n")
          try:
              start = next(i for i, l in enumerate(lines) if l.strip() == "## Errors per input")
          except StopIteration:
              raise SystemExit(0)
          end = next((i for i in range(start + 1, len(lines)) if lines[i].startswith("## ")), len(lines))

          url_re = re.compile(r"<([^>]+)>")
          code_re = re.compile(r"\[(\w+)\]")

          def recheck(url):
              out = subprocess.run(
                  ["curl", "-sS", "-o", "/dev/null", "-L", "--max-time", "30",
                   "-A", UA, "-w", "%{http_code}", url],
                  capture_output=True, text=True).stdout.strip()
              time.sleep(1)
              return out

          kept_groups, moved, checked = [], [], 0
          i = start + 1
          while i < end:
              if not lines[i].startswith("### Errors in"):
                  i += 1
                  continue
              group = [lines[i]]
              i += 1
              while i < end and not lines[i].startswith("### "):
                  group.append(lines[i])
                  i += 1
              kept = []
              for g in group:
                  m = url_re.search(g)
                  if g.lstrip().startswith("* ") and m:
                      checked += 1
                      code = recheck(m.group(1))
                      if code.isdigit() and int(code) in ACCEPT:
                          old = code_re.search(g)
                          loc = re.search(r"\(at [^)]+\)", g)
                          moved.append((m.group(1), (old.group(1) if old else "?"), code,
                                        loc.group(0) if loc else ""))
                          continue
                  kept.append(g)
              if any(x.lstrip().startswith("* ") for x in kept):
                  kept_groups.extend(kept)

          real_errors = sum(1 for x in kept_groups if x.lstrip().startswith("* "))
          lines[start:end] = (["## Errors per input", ""] + kept_groups) if kept_groups else []
          for idx, l in enumerate(lines):
              if l.startswith("| 🚫 Errors"):
                  lines[idx] = re.sub(r"\|\s*\d+\s*\|", f"| {real_errors} |", l)
                  break

          if moved:
              lines += ["", "## 复检通过（环境噪声，未计入失效）", "",
                        "> lychee 首轮判失败，串行复检返回可接受状态码；多为境外 runner 到国内站点的链路抖动。", ""]
              seen = set()
              for url, old, new, loc in moved:
                  key = (url, old, new)
                  if key in seen:
                      continue
                  seen.add(key)
                  lines.append(f"- `{old}→{new}` {url} {loc}".rstrip())

          open(REPORT, "w", encoding="utf-8").write("\n".join(lines))
          print(f"rechecked {checked}, moved to noise {len(moved)}, real errors {real_errors}")
          PY

      - name: Create or update issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPORT=./lychee/out.md
          TITLE="chore: 外链失效清单（自动巡检）"
          LABEL="broken-link"

          # label 不存在则创建（已存在会报错，忽略即可）
          gh label create "$LABEL" --color d73a4a 2>/dev/null || true

          has_failures() {
            [ -f "$REPORT" ] && grep -q '### Errors' "$REPORT"
          }
          issue_num() {
            gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty'
          }

          if has_failures; then
            # 正文里不放时间戳、不放本轮 run 链接；也不收「超时」段——超时是网络抖动（wikipedia 等），
            # 每轮条数不同，收进去等于每轮都算变化。只保留真实失效（404/410 等）。
            BODY="## 外链失效清单"$'\n\n'
            BODY+="> 仅列 404/410 等真实失效；网络超时不写入本清单（不计入失效，避免抖动刷屏）。"$'\n\n'
            BODY+="$(awk '
              /Full Github Actions output/ { next }
              /^\|.*Timeouts/ { next }
              /^## Timeouts per input/ { skip = 1; next }
              skip && /^## / { skip = 0 }
              !skip { print }
            ' "$REPORT" || true)"
            NUM="$(issue_num)"
            if [ -n "$NUM" ]; then
              CUR="$(gh issue view "$NUM" --json body --jq .body)"
              if [ "$CUR" = "$(printf '%s' "$BODY")" ]; then
                echo "清单无变化，跳过更新（不打扰订阅者）"
              else
                gh issue edit "$NUM" --body "$BODY" \
                  --add-assignee Paka-418 --add-assignee liqinglian01
                echo "已更新 issue #$NUM 并指派 Paka-418/liqinglian01"
              fi
            else
              gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY" \
                --assignee Paka-418,liqinglian01
              echo "已创建 issue 并指派 Paka-418/liqinglian01"
            fi
          else
            NUM="$(issue_num)"
            if [ -n "$NUM" ]; then
              gh issue comment "$NUM" --body "✅ 本次巡检未发现失效外链，已全部恢复。"
              gh issue close "$NUM"
              echo "已关闭 issue #$NUM"
            else
              echo "无失效外链，无需通知"
            fi
          fi
